<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Órbita — Quiz de exploración espacial</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7ff;
      --surface: rgba(255, 255, 255, .84);
      --surface-strong: #fff;
      --ink: #17213b;
      --muted: #69738f;
      --line: #dfe5f3;
      --accent: #6d5dfc;
      --accent-2: #9b8cff;
      --correct: #0fa968;
      --correct-bg: #e7faef;
      --wrong: #e24c68;
      --wrong-bg: #fff0f3;
      --star: rgba(86, 105, 180, .6);
      --shadow: 0 24px 70px rgba(45, 60, 120, .15);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101426;
        --surface: rgba(25, 31, 55, .9);
        --surface-strong: #1b223b;
        --ink: #f3f5ff;
        --muted: #aeb7d2;
        --line: #343c5d;
        --correct-bg: #123b2a;
        --wrong-bg: #472331;
        --star: rgba(190, 204, 255, .72);
        --shadow: 0 24px 70px rgba(0, 0, 0, .35);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(155, 140, 255, .25), transparent 34%),
        radial-gradient(circle at 88% 85%, rgba(82, 190, 255, .18), transparent 35%),
        var(--bg);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      opacity: .72;
      background-image:
        radial-gradient(circle at 8% 18%, var(--star) 0 1px, transparent 1.5px),
        radial-gradient(circle at 22% 76%, var(--star) 0 1px, transparent 1.5px),
        radial-gradient(circle at 38% 32%, var(--star) 0 1px, transparent 1.5px),
        radial-gradient(circle at 54% 88%, var(--star) 0 1px, transparent 1.5px),
        radial-gradient(circle at 69% 14%, var(--star) 0 1px, transparent 1.5px),
        radial-gradient(circle at 83% 63%, var(--star) 0 1px, transparent 1.5px),
        radial-gradient(circle at 94% 28%, var(--star) 0 1px, transparent 1.5px),
        radial-gradient(circle at 47% 58%, var(--star) 0 1px, transparent 1.5px);
      background-size: 240px 220px, 310px 280px, 370px 330px, 430px 390px,
        290px 260px, 350px 320px, 410px 370px, 500px 460px;
      animation: star-drift 18s ease-in-out infinite alternate;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 510px);
    }
    .quiz-card {
      position: relative;
      overflow: hidden;
      padding: 28px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .quiz-card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      top: -100px;
      right: -90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffd96a, #ff8d9d);
      opacity: .35;
      pointer-events: none;
    }
    .topline, .progress-row, .question-meta, .result-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 800;
      letter-spacing: .02em;
    }
    .brand-mark {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), #46b8ff);
      color: #fff;
      box-shadow: 0 7px 16px rgba(109,93,252,.3);
    }
    .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .score-pill {
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .progress-row { margin-top: 28px; }
    .progress-track {
      flex: 1;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--line);
    }
    .progress-fill {
      height: 100%;
      width: 10%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), #47baff);
      transition: width .35s ease;
    }
    .progress-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    h1, h2 { line-height: 1.15; }
    h1 {
      max-width: 380px;
      margin: 30px 0 9px;
      font-size: clamp(28px, 7vw, 38px);
      letter-spacing: -.045em;
    }
    h2 {
      margin: 12px 0 24px;
      font-size: clamp(22px, 5vw, 28px);
      letter-spacing: -.035em;
    }
    .intro {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 16px;
    }
    .button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 14px 18px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #8e73ff);
      box-shadow: 0 10px 20px rgba(109,93,252,.25);
      font: inherit;
      font-weight: 800;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }
    .button:hover { transform: translateY(-2px); box-shadow: 0 13px 25px rgba(109,93,252,.32); }
    .button:active { transform: translateY(0); }
    .button:focus-visible, .answer:focus-visible { outline: 3px solid rgba(71,186,255,.55); outline-offset: 3px; }
    .secondary-button {
      margin-top: 12px;
      color: var(--accent);
      background: transparent;
      box-shadow: none;
      border: 1px solid var(--line);
    }
    .secondary-button:hover { box-shadow: none; background: rgba(109,93,252,.08); }
    .screen[hidden] { display: none; }
    .question-meta { margin-top: 29px; }
    .question-number { color: var(--accent); font-weight: 800; }
    .question-text {
      position: relative;
      isolation: isolate;
      margin: 12px 0 22px;
      padding: 27px 24px 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 18px;
      background:
        linear-gradient(rgba(109, 93, 252, .06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(109, 93, 252, .06) 1px, transparent 1px),
        var(--surface-strong);
      background-size: 22px 22px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .12),
        0 12px 24px rgba(25, 35, 75, .08);
      font-size: clamp(22px, 5vw, 28px);
      letter-spacing: -.035em;
    }
    .question-text::before {
      content: "INCOMING TRANSMISSION  //  MISSION CONTROL";
      position: absolute;
      top: 10px;
      left: 24px;
      z-index: -1;
      color: var(--accent);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .13em;
      line-height: 1;
      opacity: .85;
    }
    .question-text::after {
      content: "";
      position: absolute;
      top: 12px;
      right: 15px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--correct);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--correct) 18%, transparent), 0 0 13px color-mix(in srgb, var(--correct) 55%, transparent);
    }
    .answers { display: grid; gap: 11px; }
    .answer {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 13px 14px;
      cursor: pointer;
      color: var(--ink);
      background: color-mix(in srgb, var(--surface-strong) 76%, transparent);
      text-align: left;
      font: inherit;
      font-size: 15px;
      transition: border-color .2s ease, transform .2s ease, background .2s ease;
    }
    .answer:hover:not(:disabled) { transform: translateX(3px); border-color: var(--accent-2); }
    .answer:disabled { cursor: default; }
    .answer-letter {
      display: grid;
      flex: 0 0 29px;
      height: 29px;
      place-items: center;
      border-radius: 9px;
      color: var(--accent);
      background: rgba(109,93,252,.12);
      font-size: 12px;
      font-weight: 800;
    }
    .answer.correct { border-color: var(--correct); color: var(--correct); background: var(--correct-bg); animation: pop .45s ease; }
    .answer.correct .answer-letter { color: #fff; background: var(--correct); }
    .answer.wrong { border-color: var(--wrong); color: var(--wrong); background: var(--wrong-bg); animation: shake .42s ease; }
    .answer.wrong .answer-letter { color: #fff; background: var(--wrong); }
    .feedback {
      min-height: 24px;
      margin: 15px 2px 0;
      font-size: 14px;
      font-weight: 800;
    }
    .feedback.correct { color: var(--correct); }
    .feedback.wrong { color: var(--wrong); }
    .next-button { margin-top: 8px; }
    .result {
      padding: 14px 0 3px;
      text-align: center;
    }
    .result-emoji {
      display: grid;
      width: 96px;
      height: 96px;
      margin: 10px auto 18px;
      place-items: center;
      border-radius: 30px;
      background: linear-gradient(135deg, #ffdf72, #ff9e9e);
      box-shadow: 0 14px 25px rgba(255, 158, 158, .25);
      font-size: 49px;
      animation: float 2.5s ease-in-out infinite;
    }
    .result p { margin: 0 auto 24px; max-width: 350px; color: var(--muted); }
    .result-meta {
      margin: 0 0 24px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      text-align: left;
    }
    .result-meta strong { display: block; font-size: 20px; }
    .result-meta span { color: var(--muted); font-size: 12px; }
    .burst { animation: burst .65s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(4px); }
    }
    @keyframes pop {
      0% { transform: scale(.97); }
      60% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
    }
    @keyframes burst {
      0% { transform: scale(.9); opacity: .5; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }
    @keyframes star-drift {
      from { transform: scale(1); opacity: .58; }
      to { transform: scale(1.035); opacity: .82; }
    }
    @media (max-width: 430px) {
      .quiz-card { padding: 22px 18px; border-radius: 23px; }
      h1 { margin-top: 25px; }
      .question-text { padding: 27px 18px 22px; }
      .question-text::before { left: 18px; font-size: 8px; letter-spacing: .09em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      body::before { animation: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="quiz-card" aria-live="polite">
      <div class="topline">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> ÓRBITA</div>
        <div class="score-pill">Puntos: <span id="score">0</span></div>
      </div>

      <div id="start-screen" class="screen">
        <p class="eyebrow" style="margin-top: 32px;">Misión de conocimiento</p>
        <h1>¿Listo para despegar?</h1>
        <p class="intro">Pon a prueba tus conocimientos sobre la exploración espacial. Diez preguntas, una pequeña gran misión.</p>
        <button class="button" id="start-button" type="button">Comenzar misión <span aria-hidden="true">→</span></button>
      </div>

      <div id="quiz-screen" class="screen" hidden>
        <div class="progress-row">
          <div class="progress-track" aria-label="Progreso del cuestionario"><div class="progress-fill" id="progress-fill"></div></div>
          <span class="progress-label" id="progress-label">1 / 10</span>
        </div>
        <div class="question-meta">
          <span class="question-number" id="question-number">Pregunta 01</span>
          <span class="eyebrow">Exploración espacial</span>
        </div>
        <h2 class="question-text" id="question-text"></h2>
        <div class="answers" id="answers"></div>
        <p class="feedback" id="feedback" role="status"></p>
        <button class="button next-button" id="next-button" type="button" hidden>Siguiente pregunta <span aria-hidden="true">→</span></button>
      </div>

      <div id="result-screen" class="screen result" hidden>
        <div class="result-emoji" id="result-emoji" aria-hidden="true">🚀</div>
        <p class="eyebrow">Misión completada</p>
        <h2 id="result-title">¡Buen viaje!</h2>
        <p id="result-message"></p>
        <div class="result-meta">
          <div><strong id="final-score">0 / 10</strong><span>Puntuación final</span></div>
          <div style="text-align:right;"><strong id="final-percent">0%</strong><span>Precisión</span></div>
        </div>
        <button class="button" id="restart-button" type="button">Volver a intentarlo <span aria-hidden="true">↻</span></button>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      { text: "¿Cuál fue el primer satélite artificial puesto en órbita?", options: ["Explorer 1", "Sputnik 1", "Vanguard 1", "Luna 2"], answer: 1, fact: "Sputnik 1, lanzado por la Unión Soviética en 1957, inauguró la era espacial." },
      { text: "¿Cómo se llama el planeta conocido como el planeta rojo?", options: ["Venus", "Júpiter", "Marte", "Mercurio"], answer: 2, fact: "Marte debe su color rojizo al óxido de hierro presente en su superficie." },
      { text: "¿Qué misión llevó por primera vez seres humanos a la Luna?", options: ["Apollo 8", "Apollo 11", "Gemini 4", "Artemis I"], answer: 1, fact: "Apollo 11 alunizó en julio de 1969 con Armstrong, Aldrin y Collins." },
      { text: "¿Qué agencia espacial construyó el telescopio James Webb junto a sus socios?", options: ["NASA", "ESA", "JAXA", "Las tres anteriores"], answer: 3, fact: "NASA, ESA y CSA colaboraron en el telescopio espacial James Webb." },
      { text: "¿Cuál es el nombre de nuestra galaxia?", options: ["Andrómeda", "Vía Láctea", "Triángulo", "Sombrero"], answer: 1, fact: "Vivimos en la Vía Láctea, una galaxia espiral con cientos de miles de millones de estrellas." },
      { text: "¿Qué rover llegó a Marte en febrero de 2021?", options: ["Spirit", "Curiosity", "Perseverance", "Opportunity"], answer: 2, fact: "Perseverance aterrizó en el cráter Jezero para estudiar su antigua geología." },
      { text: "¿Qué es la Estación Espacial Internacional?", options: ["Un telescopio", "Un laboratorio orbital", "Un satélite meteorológico", "Una nave de carga"], answer: 1, fact: "La EEI es un laboratorio orbital habitado permanentemente desde el año 2000." },
      { text: "¿Qué combustible suele impulsar los cohetes al espacio?", options: ["Agua y oxígeno", "Combustible y oxidante", "Helio líquido", "Vapor de mercurio"], answer: 1, fact: "Los cohetes llevan combustible y oxidante para funcionar incluso sin aire atmosférico." },
      { text: "¿Cuánto tarda aproximadamente la luz del Sol en llegar a la Tierra?", options: ["8 segundos", "8 minutos", "8 horas", "8 días"], answer: 1, fact: "La luz solar recorre la distancia hasta la Tierra en unos 8 minutos y 20 segundos." },
      { text: "¿Qué busca principalmente la misión Artemis?", options: ["Explorar Venus", "Volver a la Luna", "Desviar asteroides", "Construir un telescopio"], answer: 1, fact: "Artemis prepara el regreso humano a la Luna y futuras misiones a Marte." }
    ];

    const $ = (id) => document.getElementById(id);
    let current = 0;
    let score = 0;
    let answered = false;

    function showScreen(id) {
      ["start-screen", "quiz-screen", "result-screen"].forEach((screen) => {
        $(screen).hidden = screen !== id;
      });
    }

    function renderQuestion() {
      const question = questions[current];
      answered = false;
      $("question-number").textContent = `Pregunta ${String(current + 1).padStart(2, "0")}`;
      $("progress-label").textContent = `${current + 1} / ${questions.length}`;
      $("progress-fill").style.width = `${((current + 1) / questions.length) * 100}%`;
      $("question-text").textContent = question.text;
      $("feedback").textContent = "";
      $("feedback").className = "feedback";
      $("next-button").hidden = true;
      $("answers").innerHTML = question.options.map((option, index) => `
        <button class="answer" type="button" data-index="${index}">
          <span class="answer-letter">${String.fromCharCode(65 + index)}</span>
          <span>${option}</span>
        </button>
      `).join("");
      document.querySelectorAll(".answer").forEach((button) => button.addEventListener("click", handleAnswer));
    }

    function handleAnswer(event) {
      if (answered) return;
      answered = true;
      const selected = Number(event.currentTarget.dataset.index);
      const question = questions[current];
      const buttons = [...document.querySelectorAll(".answer")];
      buttons.forEach((button) => { button.disabled = true; });
      buttons[question.answer].classList.add("correct");
      if (selected === question.answer) {
        score++;
        $("score").textContent = score;
        $("feedback").textContent = `¡Correcto! ${question.fact}`;
        $("feedback").className = "feedback correct";
      } else {
        event.currentTarget.classList.add("wrong");
        $("feedback").textContent = `Casi. ${question.fact}`;
        $("feedback").className = "feedback wrong";
      }
      $("next-button").hidden = false;
      $("next-button").focus();
    }

    function showResults() {
      const percentage = Math.round((score / questions.length) * 100);
      let emoji = "🛰️";
      let title = "Buen despegue";
      let message = "Ya tienes una buena base. ¡Sigue explorando!";
      if (percentage >= 90) { emoji = "🌟"; title = "¡Comandante estelar!"; message = "Tu conocimiento está en otra galaxia. ¡Impresionante misión!"; }
      else if (percentage >= 70) { emoji = "🚀"; title = "¡Misión cumplida!"; message = "Has navegado con soltura por el cosmos. ¡Muy buen trabajo!"; }
      else if (percentage < 40) { emoji = "🌱"; title = "Todo viaje empieza"; message = "El universo es enorme y siempre hay algo nuevo que aprender."; }
      $("result-emoji").textContent = emoji;
      $("result-emoji").classList.remove("burst");
      void $("result-emoji").offsetWidth;
      $("result-emoji").classList.add("burst");
      $("result-title").textContent = title;
      $("result-message").textContent = message;
      $("final-score").textContent = `${score} / ${questions.length}`;
      $("final-percent").textContent = `${percentage}%`;
      showScreen("result-screen");
    }

    $("start-button").addEventListener("click", () => {
      current = 0;
      score = 0;
      $("score").textContent = "0";
      showScreen("quiz-screen");
      renderQuestion();
    });
    $("next-button").addEventListener("click", () => {
      current++;
      if (current < questions.length) renderQuestion();
      else showResults();
    });
    $("restart-button").addEventListener("click", () => {
      current = 0;
      score = 0;
      $("score").textContent = "0";
      showScreen("quiz-screen");
      renderQuestion();
    });
  </script>
</body>
</html>
